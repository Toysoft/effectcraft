[package]
name = "effectcraft-ios"
description = "EffectCraft native iPhone and iPad editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# User-authorized exception: one borrowed UIKit handle conversion in mobile.rs. The rest of
# this frontend denies unsafe, and all other workspace crates keep their existing forbid.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
effectcraft-engine = { workspace = true }
effectcraft-host = { workspace = true }
effectcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
cpal = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
winit = { version = "0.30", default-features = false }
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSSet", "NSObject"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIApplication", "UIResponder", "UIScene", "UIWindow", "UIWindowScene", "UIOrientation", "UIPasteboard", "UIView", "UIViewController", "UISceneSizeRestrictions", "objc2-core-foundation"] }

objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
robius-file-picker = "=0.3.1"
cidre = { version = "=0.29.0", default-features = false, features = ["gc", "blocks", "ios_18_0", "ui", "ut", "ns"] }
